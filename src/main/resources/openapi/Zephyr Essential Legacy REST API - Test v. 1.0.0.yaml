openapi: 3.0.1
info:
  title: Zephyr Essential Legacy REST API - Test
  version: 1.0.0
servers:
  - url: https://prod-api.zephyr4jiracloud.com/connect
tags:
  - name: Attachment
    description: Attachment Resource
  - name: Chart
    description: Chart Resource
  - name: Config
    description: Config Resource
  - name: Cycle
    description: Cycle Resource
  - name: Execution
    description: Execution Resource
  - name: Folder
    description: Folder Resource
  - name: Report
    description: Report Resource
  - name: JobProgress
    description: JobProgress Resource
  - name: License
    description: License Resource
  - name: ServerInfo
    description: ServerInfo Resource
  - name: StepResult
    description: StepResult Resource
  - name: TestStep
    description: TestStep Resource
  - name: Traceability
    description: Traceability Resource
  - name: ZQL
    description: ZQL Resource
  - name: ZQLFilter
    description: ZQLFilter Resource
paths:
  /public/rest/api/1.0/execution:
    post:
      tags:
        - Execution
      summary: Create Execution
      description: >-
        Creates an execution from a JSON representation. An execution can be
        assigned to a user using the assigneeType. assigneeType can be
        currentUser/assignee 
         <table width="100%" border="1"> <tbody> <tr> <td colspan="4"><strong> JSON Object Details</strong></td> </tr> <tr> <td><strong>Parameter</strong></td> <td><strong>Type</strong></td> <td><strong>Value</strong></td><td><strong>Required</strong></td> </tr> <tr> <td>status</td> <td>Object</td> <td>{&quot;id&quot;:1}</td> </tr> <tr> <td>id</td> <td>String</td> <td>0001456664462103-5a6ee13a3f6b-0001</td> <td>Y</td></tr> <tr> <td>projectId</td> <td>Integer</td> <td>10000</td> <td>Y</td></tr> <tr> <td>issueId</td> <td>Integer</td> <td>10000</td> <td>Y</td></tr> <tr> <td>cycleId</td> <td>String</td> <td>0001456664262308-5a6ee13a3f6b-0001</td> </tr> <tr> <td>versionId</td> <td>Integer</td> <td>-1</td> <td>Y</td></tr> <tr> <td>assigneeType</td> <td>String</td> <td>currentUser/assignee</td> <td>N</td></tr><tr> <td>assignee</td> <td>String</td> <td>assigneeName (if assigneeType is assignee)</td> <td>N</td></tr> </tbody></table>
      parameters:
        - name: request
          in: query
          description: '{"status":{"id":1},"id":"0001456664462103-5a6ee13a3f6b-0001","projectId":10000,"issueId":10000,"cycleId":"0001456664262308-5a6ee13a3f6b-0001","versionId":-1,,"assigneeType":"assignee","assignee":"jiraUserKey"}'
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: response
          in: query
          description: >-
            {"execution":{"id":"0001456664462103-5a6ee13a3f6b-0001","issueId":10000,"versionId":-1,"projectId":10000,"cycleId":"0001456664262308-5a6ee13a3f6b-0001","orderId":1,"executedBy":"admin","executedOn":"02-28-2016
            05:03:57","modifiedBy":"admin","createdBy":"admin","status":{"name":"PASS","id":1,"description":"Test
            was executed and passed
            successfully.","color":"#75B000","type":0},"cycleName":"aaaa","defects":[],"stepDefects":[],"executionDefectCount":0,"stepDefectCount":0,"totalDefectCount":0,"tenantKey":"amlyYTphN2VkOTUxZi1lZjg5LTQ0ZDktODJlZi1mMjM4YjRkY2FiN2I=","creationDate":"02-28-2016
            05:01:02","issueIndex":10000,"projectCycleVersionIndex":"10000_0001456664262308-5a6ee13a3f6b-0001_-1","executionStatusIndex":1,"projectIssueCycleVersionIndex":"10000_10000_0001456664262308-5a6ee13a3f6b-0001_-1"},"issueKey":"TEST-1","issueLabel":"","component":"","issueSummary":"AAA","projectName":"Test","versionName":"Unscheduled","priority":"Medium","executedByDisplayName":{"defined":true,"empty":false,"orNull":"admin"},"testStepBeans":null,"defectsAsString":"","projectKey":"TEST"}
          required: false
          style: form
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: Success
  /public/rest/api/1.0/execution/statuses:
    get:
      tags:
        - Execution
      summary: 'Get execution statuses '
      description: ' Get all execution statuses '
      parameters:
        - name: response
          in: query
          description: >-
            [{"name":"UNEXECUTED","id":-1,"description":"The test has not yet
            been
            executed.","color":"#A0A0A0","type":0},{"name":"PASS","id":1,"description":"Test
            was executed and passed
            successfully.","color":"#75B000","type":0},{"name":"FAIL","id":2,"description":"Test
            was executed and
            failed.","color":"#CC3300","type":0},{"name":"WIP","id":3,"description":"Test
            execution is a
            work-in-progress.","color":"#F2B000","type":0},{"name":"BLOCKED","id":4,"description":"The
            test execution of this test was blocked for some
            reason.","color":"#6693B0","type":0}]
          required: false
          style: form
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: Success
  /public/rest/api/1.0/execution/{executionId}:
    get:
      tags:
        - Execution
      summary: 'Get Execution '
      description: Retrieves Execution and ExecutionStatus by ExecutionId
      parameters:
        - name: projectId
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: integer
        - name: issueId
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: integer
        - name: executionId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
        - name: response
          in: query
          description: >-
            {"execution":{"execution":{"id":"0001456664462103-5a6ee13a3f6b-0001","issueId":10000,"versionId":-1,"projectId":10000,"cycleId":"0001456664262308-5a6ee13a3f6b-0001","orderId":1,"executedBy":"admin","executedOn":"02-28-2016
            05:03:57","modifiedBy":"admin","createdBy":"admin","status":{"name":"PASS","id":1,"description":"Test
            was executed and passed
            successfully.","color":"#75B000","type":0},"cycleName":"aaaa","defects":[{"id":10001,"key":"TEST-2","summary":"BBB","status":{"self":"http://192.168.1.68:2990/jira/rest/api/2/status/10000","name":"To
            Do","id":10000,"description":"","iconUrl":"http://192.168.1.68:2990/jira/images/icons/status_generic.gif"}}],"stepDefects":[],"executionDefectCount":1,"stepDefectCount":0,"totalDefectCount":1,"tenantKey":"amlyYTphN2VkOTUxZi1lZjg5LTQ0ZDktODJlZi1mMjM4YjRkY2FiN2I=","creationDate":"02-28-2016
            05:01:02","issueIndex":10000,"projectCycleVersionIndex":"10000_0001456664262308-5a6ee13a3f6b-0001_-1","executionStatusIndex":1,"projectIssueCycleVersionIndex":"10000_10000_0001456664262308-5a6ee13a3f6b-0001_-1"},"issueKey":"TEST-1","issueLabel":"","component":"","issueSummary":"AAA","projectName":"Test","versionName":"Unscheduled","priority":"Medium","executedByDisplayName":{"defined":true,"empty":false,"orNull":"admin"},"testStepBeans":null,"defectsAsString":"","projectKey":"TEST"},"executionStatus":{"-1":{"name":"UNEXECUTED","id":-1,"description":"The
            test has not yet been
            executed.","color":"#A0A0A0","type":0},"1":{"name":"PASS","id":1,"description":"Test
            was executed and passed
            successfully.","color":"#75B000","type":0},"2":{"name":"FAIL","id":2,"description":"Test
            was executed and
            failed.","color":"#CC3300","type":0},"3":{"name":"WIP","id":3,"description":"Test
            execution is a
            work-in-progress.","color":"#F2B000","type":0},"4":{"name":"BLOCKED","id":4,"description":"The
            test execution of this test was blocked for some
            reason.","color":"#6693B0","type":0}}}
          required: false
          style: form
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: Success
    put:
      tags:
        - Execution
      summary: Update Execution
      description: >-
        Updates the specified execution from a JSON representation. This API can
        do the following updates: 
          <ol><li>Assign Execution to a user using the assigneeType field. assigneeType can be currentUser/assignee. In order to change an assignee, one will have to pass in the changeAssignee flag </li> <li>Associate defects to an execution. </li> <li>Update comment for the execution.</li></ol> 
         <table width="100%" border="1"> <tbody> <tr> <td colspan="4"><strong> JSON Object Details</strong></td> </tr> <tr> <td><strong>Parameter</strong></td> <td><strong>Type</strong></td> <td><strong>Value</strong></td> </tr> <tr> <td>status</td> <td>Object</td> <td>{&quot;id&quot;:1}</td> </tr> <tr> <td>id</td> <td>String</td> <td>0001456664462103-5a6ee13a3f6b-0001</td> <td>N</td></tr> <tr> <td>projectId</td> <td>Integer</td> <td>10000</td> <td>Y</td></tr> <tr> <td>issueId</td> <td>Integer</td> <td>10000</td> <td>Y</td></tr> <tr> <td>cycleId</td> <td>String</td> <td>0001456664262308-5a6ee13a3f6b-0001</td> <td>Y</td></tr> <tr> <td>versionId</td> <td>Integer</td> <td>-1</td> <td>Y</td></tr> </tbody></table>
      parameters:
        - name: executionId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
        - name: request
          in: query
          description: >-
            {"status":{"id":1},"id":"0001456664462103-5a6ee13a3f6b-0001","projectId":10000,"issueId":10000,"cycleId":"0001456664262308-5a6ee13a3f6b-0001","versionId":-1,"comment":"Comment
            for
            execution","defects":"["IZ-1","IZ-2"]","assigneeType":"currentUser/assignee","assignee":"userKey"}
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: response
          in: query
          description: >-
            {"execution":{"id":"0001456664462103-5a6ee13a3f6b-0001","issueId":10000,"versionId":-1,"projectId":10000,"cycleId":"0001456664262308-5a6ee13a3f6b-0001","orderId":1,"executedBy":"admin","executedOn":"02-28-2016
            05:03:57","modifiedBy":"admin","createdBy":"admin","status":{"name":"PASS","id":1,"description":"Test
            was executed and passed
            successfully.","color":"#75B000","type":0},"cycleName":"aaaa","defects":[],"stepDefects":[],"executionDefectCount":0,"stepDefectCount":0,"totalDefectCount":0,"tenantKey":"amlyYTphN2VkOTUxZi1lZjg5LTQ0ZDktODJlZi1mMjM4YjRkY2FiN2I=","creationDate":"02-28-2016
            05:01:02","issueIndex":10000,"projectCycleVersionIndex":"10000_0001456664262308-5a6ee13a3f6b-0001_-1","executionStatusIndex":1,"projectIssueCycleVersionIndex":"10000_10000_0001456664262308-5a6ee13a3f6b-0001_-1"},"issueKey":"TEST-1","issueLabel":"","component":"","issueSummary":"AAA","projectName":"Test","versionName":"Unscheduled","priority":"Medium","executedByDisplayName":{"defined":true,"empty":false,"orNull":"admin"},"testStepBeans":null,"defectsAsString":"","projectKey":"TEST"}
          required: false
          style: form
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: Success
  /public/rest/api/1.0/execution/:executionId:
    delete:
      tags:
        - Execution
      summary: 'Delete Execution '
      description: |-
        Delete an execution. 
         Deleting an execution will also delete the associated attachments/stepresults and will remove the defect remote links.
      responses:
        '200':
          description: Success
  /public/rest/api/1.0/executions:
    get:
      tags:
        - Execution
      summary: 'Get List of Executions '
      description: |-
        Retrieves execution(s) based on the passed in parameters. 
         Executions are fetched in a paginated fashion in a batch of 50. Users can use the offset and totalCount parameters to make a paginated call to retrieve all executions.
      parameters:
        - name: projectId
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: integer
        - name: issueId
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: sortColumn
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: sortOrder
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: response
          in: query
          description: >-
            {"execution":{"execution":{"id":"0001456664462103-5a6ee13a3f6b-0001","issueId":10000,"versionId":-1,"projectId":10000,"cycleId":"0001456664262308-5a6ee13a3f6b-0001","orderId":1,"executedBy":"admin","executedOn":"02-28-2016
            05:03:57","modifiedBy":"admin","createdBy":"admin","status":{"name":"PASS","id":1,"description":"Test
            was executed and passed
            successfully.","color":"#75B000","type":0},"cycleName":"aaaa","defects":[{"id":10001,"key":"TEST-2","summary":"BBB","status":{"self":"http://192.168.1.68:2990/jira/rest/api/2/status/10000","name":"To
            Do","id":10000,"description":"","iconUrl":"http://192.168.1.68:2990/jira/images/icons/status_generic.gif"}}],"stepDefects":[],"executionDefectCount":1,"stepDefectCount":0,"totalDefectCount":1,"tenantKey":"amlyYTphN2VkOTUxZi1lZjg5LTQ0ZDktODJlZi1mMjM4YjRkY2FiN2I=","creationDate":"02-28-2016
            05:01:02","issueIndex":10000,"projectCycleVersionIndex":"10000_0001456664262308-5a6ee13a3f6b-0001_-1","executionStatusIndex":1,"projectIssueCycleVersionIndex":"10000_10000_0001456664262308-5a6ee13a3f6b-0001_-1"},"issueKey":"TEST-1","issueLabel":"","component":"","issueSummary":"AAA","projectName":"Test","versionName":"Unscheduled","priority":"Medium","executedByDisplayName":{"defined":true,"empty":false,"orNull":"admin"},"testStepBeans":null,"defectsAsString":"","projectKey":"TEST"},"executionStatus":{"-1":{"name":"UNEXECUTED","id":-1,"description":"The
            test has not yet been
            executed.","color":"#A0A0A0","type":0},"1":{"name":"PASS","id":1,"description":"Test
            was executed and passed
            successfully.","color":"#75B000","type":0},"2":{"name":"FAIL","id":2,"description":"Test
            was executed and
            failed.","color":"#CC3300","type":0},"3":{"name":"WIP","id":3,"description":"Test
            execution is a
            work-in-progress.","color":"#F2B000","type":0},"4":{"name":"BLOCKED","id":4,"description":"The
            test execution of this test was blocked for some
            reason.","color":"#6693B0","type":0}}}
          required: false
          style: form
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: Success
    post:
      tags:
        - Execution
      summary: Update Executions in Bulk
      description: |-
        Updates all the execution(s) that fits in the search criteria 
         <table width="100%" border="1"> <tbody> <tr> <td colspan="3"><strong> JSON Object Details</strong></td> </tr> <tr> <td><strong>Parameter</strong></td> <td><strong>Type</strong></td> <td><strong>Value</strong></td> </tr> <tr> <td>executions</td> <td>String Array</td> <td>[&quot;0001462834520641-242ac112b-0001&quot;,&quot;0001462834520819-242ac112b-0001&quot;,&quot;0001462834521014-242ac112b-0001&quot;]</td> </tr> <tr> <td>status</td> <td>Integer</td> <td>1</td> </tr> <tr> <td>clearDefectMappingFlag</td> <td>Boolean</td> <td>false</td> </tr> <tr> <td>testStepStatusChangeFlag</td> <td>Boolean</td> <td>true</td> </tr> <tr> <td>stepStatus</td> <td>Integer</td> <td>-1</td> </tr> </tbody></table>
      parameters:
        - name: request
          in: query
          description: '{"executions":["0001462834520641-242ac112b-0001","0001462834520819-242ac112b-0001","0001462834521014-242ac112b-0001"],"status":1,"clearDefectMappingFlag":false,"testStepStatusChangeFlag":true,"stepStatus":-1}'
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: response
          in: query
          description: >-
            {"timeTaken":"0 min, 0
            sec","stepMessage":"","summaryMessage":"","errorMessage":"","progress":1.0,"message":"{\"success\":\"0001462834520641-242ac112b-0001,0001462834520819-242ac112b-0001,0001462834521014-242ac112b-0001\",\"error\":\"\"}","stepLabel":"","stepMessages":[]}
          required: false
          style: form
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: Success
  /public/rest/api/1.0/executions/search/cycle/{cycleId}:
    get:
      tags:
        - Execution
      summary: 'Get List of Executions '
      description: |-
        Retrieves execution(s) by CycleId. 
         Executions are fetched in a paginated fashion in a batch of 50. Users can use the offset and totalCount parameters to make a paginated call to retrieve all executions. 
      parameters:
        - name: projectId
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: integer
        - name: cycleId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
        - name: versionId
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: action
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: sortBy
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
        - name: sortOrder
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: expand
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: response
          in: query
          description: >
            {"searchObjectList":[],"totalCount":0,"currentOffset":1,"executionStatus":{"-1":{"name":"UNEXECUTED","id":-1,"description":"The
            test has not yet been
            executed.","color":"#A0A0A0","type":0},"1":{"name":"PASS","id":1,"description":"Test
            was executed and passed
            successfully.","color":"#75B000","type":0},"2":{"name":"FAIL","id":2,"description":"Test
            was executed and
            failed.","color":"#CC3300","type":0},"3":{"name":"WIP","id":3,"description":"Test
            execution is a
            work-in-progress.","color":"#F2B000","type":0},"4":{"name":"BLOCKED","id":4,"description":"The
            test execution of this test was blocked for some
            reason.","color":"#6693B0","type":0}},"stepExecutionStatus":null}
          required: false
          style: form
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: Success
  /public/rest/api/1.0/executions/add/cycle/{cycleId}:
    post:
      tags:
        - Execution
      summary: 'Add Tests to Cycle '
      description: >-
        Adds Tests(s) to a Cycle. Users can assign all executions to an
        individual while adding test to cycle.Users can add tests to cycle by
        following options. <ol><li>Individually by passing array of issueKeys
        (method passed in the request should be 1).</li><li>By JQL Search filter
        (method passed in the request should be 2).</li><li>3. From Another
        Cycle using various filters (method passed in the request should be 3).
        For e.g. filters test based on
        fromVersionId/fromCycleId/priorities/statuses 
        {"versionId":11300,"fromVersionId":"11300","fromCycleId":"0001481179874128-242ac112-0001","priorities":"1","statuses":"4","components":"","labels":"","hasDefects":false,"projectId":11300,"method":"3","assigneeType":"currentUser"}</li></ol>
         <table width="100%" border="1"> <tbody> <tr> <td colspan="3"><strong> JSON Object Details</strong></td> </tr> <tr> <td><strong>Parameter</strong></td> <td><strong>Type</strong></td> <td><strong>Value</strong></td> </tr> <tr> <td>issues</td> <td>String Array</td> <td>[&quot;TEST-1&quot;]</td> </tr> <tr> <td>versionId</td> <td>Integer</td> <td>-1</td> </tr> <tr> <td>projectId</td> <td>Integer</td> <td>10000</td> </tr> <tr> <td>method</td> <td>String</td> <td>&quot;1&quot;</td> </tr> </tbody></table>
      parameters:
        - name: cycleId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
        - name: request
          in: query
          description: >-
            {"issues":["TEST-1"],"versionId":-1,"projectId":10000,"method":"1 or
            2 or 3", "folderId":"-1"}
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: response
          in: query
          description: >-
            {"timeTaken":"0 min, 0
            sec","stepMessage":null,"summaryMessage":null,"progress":1.0,"message":"{\"success\":[\"<a
            target='_parent'
            href='http://192.168.1.68:2990/jira/browse/TEST-1'>TEST-1</a>\"]}","stepMessages":[]}
          required: false
          style: form
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: Success
  /public/rest/api/1.0/executions/export:
    post:
      tags:
        - Execution
      summary: 'Export Executions '
      description: >-
        Exports the execution(s) based on the ZQL and the executions selected.
        It is mandatory to send the ZQL with the request. This API returns a
        jobprogressTicket which should be used for making the call to
        /public/rest/api/1.0/jobprogress/:jobProgressTicket. 
         Once the request is processed, the jobProgress will populate the summaryMessage field with the fileName which should than be passed in to /public/rest/api/1.0/cycle/export/download/:fileName to download the file 
         <table width="100%" border="1"> <tbody> <tr> <td colspan="4"><strong> JSON Object Details</strong></td> </tr> <tr> <td><strong>Parameter</strong></td> <td><strong>Type</strong></td> <td><strong>Value</strong></td><td><strong>Required</strong></td> </tr> <tr> <td>exportType</td> <td>String</td> <td>xml/html/csv</td><td>Y</td> </tr><tr> <td>expand</td> <td>String</td> <td>teststeps</td><td>N</td></tr> <tr> <td>executions</td> <td>String Array</td> <td>[&quot;0001456662092010-5a6ee13a3f6b-0001&quot;]</td><td>Y</td> </tr> <tr> <td>startIndex</td> <td>Integer</td> <td>0</td> <td>N</td></tr> <tr> <td>maxAllowed</td> <td>Boolean</td> <td>true</td><td>N</td> </tr> <tr> <td>zqlQuery</td> <td>String</td> <td>&quot;&quot;</td> <td>Y</td></tr> </tbody></table>
      parameters:
        - name: request
          in: query
          description: '{"exportType":"xml","expand":"teststeps","executions":["0001456662092010-5a6ee13a3f6b-0001"],"startIndex":0,"maxAllowed":true,"zqlQuery":"project=TST"}'
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: response
          in: query
          description: 0001456663770473-5a6ee13a3f6b-0001
          required: false
          style: form
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: Success
  /public/rest/api/1.0/executions/export/download/:fileName:
    get:
      tags:
        - Execution
      summary: Export execution download
      description: Download file with Execution data.
      responses:
        '200':
          description: Success
  /public/rest/api/1.0/executions/search/sprint/{sprintId}/issues:
